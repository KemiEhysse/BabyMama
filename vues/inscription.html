<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>BabyMama – Inscription</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link rel="stylesheet" href="../vues_css/inscription.css">

</head>

<body>

<header class="header">
  <div class="logo-container">
    <img src="../vues_assets/img/logobabymama.png" class="logo-heart" alt="logo coeur">
    <span class="logo-text">Baby<span>Mama</span></span>
  </div>
</header>

<!-- CONTENU -->
<div class="container">

  <!-- GAUCHE -->
  <div class="left">
    <div class="left-content">
      <img src="../vues_assets/img/mamanyeuxfermer.png" class="woman" alt="femme enceinte">

      <button class="btn">S’inscrire</button>

      <div class="google">
        ou Continuer avec
        <img src="https://upload.wikimedia.org/wikipedia/commons/0/09/IOS_Google_icon.png">
      </div>
    </div>
  </div>

  <!-- TRAIT -->
  <hr class="ligne-horizontale">
  <!-- DROITE -->
  <div class="right">
    <h1>Inscription</h1>

    <form class="form">
      <div class="input-group">
        <i class="fa-solid fa-user"></i>
        <input type="text" placeholder="Nom">
      </div>

      <div class="input-group">
        <i class="fa-solid fa-user"></i>
        <input type="text" placeholder="Prénom">
      </div>

      <div class="input-group">
        <i class="fa-solid fa-cake-candles"></i>
        <input type="date" placeholder="Date de naissance">
      </div>

      <div class="input-group">
        <i class="fa-solid fa-calendar-days"></i>
        <input type="date" placeholder="Date début accouchement">
      </div>

      <div class="input-group">
        <i class="fa-solid fa-phone"></i>
        <input type="tel" placeholder="Téléphone">
      </div>

      <div class="input-group">
        <i class="fa-solid fa-lock"></i>
        <input type="password" placeholder="Mot de passe">
      </div>
    </form>
  </div>

</div>
<script src="../vues_js/inscription.js"></script>
</body>
</html>
