<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BabyMama Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../vues_css/contact.css">
</head>
<body>

    <header class="top-bar">
        <div class="logo">
            <img src="../vues_assets/img/logobabymama.png" alt="BabyMama Logo" class="logo-heart"> 
            <span>Baby<span>Mama</span></span>
        </div>
        <div class="user">
            <i class="fa-solid fa-circle-user"></i>
            <span>Utilisateur</span>
        </div>
    </header>

    <div class="container">
        <aside class="nav-sidebar">
            <ul>
                <li class="active"><i class="fa-solid fa-house"></i> Accueil</li>
                <li><i class="fa-solid fa-person-running"></i> Symptômes</li>
                <li><i class="fa-solid fa-bell"></i> Rappels</li>
                <li><i class="fa-solid fa-book-open"></i> Journal</li>
                <li><i class="fa-solid fa-circle-user"></i> Profil</li>
            </ul>
        </aside>
        <main class="content">
            <div class="white-container">
                
                <section class="contacts-section">
                    <h3>Mes contacts</h3>
                    <div class="contacts-list">
                        <div class="contact-card">
                            <div class="contact-avatar">
                                <i class="fa-solid fa-circle-user"></i>
                            </div>
                            <div class="contact-info">
                                <strong>Dr Isabelle</strong>
                                <span>Gynecologue</span>
                                <p>0141865434</p>
                            </div>
                        </div>
                        <div class="contact-card">
                            <div class="contact-avatar">
                                <i class="fa-solid fa-circle-user"></i>
                            </div>
                            <div class="contact-info">
                                <strong>Dr Isabelle</strong>
                                <span>Gynecologue</span>
                                <p>0141865434</p>
                            </div>
                        </div>
                    </div>
                    <button class="btn-add">
                        <i class="fa-solid fa-plus"></i> Ajouter
                    </button>
                </section>

                <section class="suggestions-section">
                    <h3>Suggestions</h3>
                    <div class="suggestion-card">
                        <div class="contact-avatar">
                            <i class="fa-solid fa-circle-user"></i>
                        </div>
                        <div class="contact-info">
                            <strong>Dr Isabelle</strong>
                            <span>Gynecol</span>
                            <p>0141865</p>
                        </div>
                    </div>
                </section>

            </div>
        </main>
    </div> </body>
</html>
